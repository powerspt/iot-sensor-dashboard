# ============================================================
# 배포 B · 단순 IP:포트 직접 공개 (Cloudflare 불필요)
# ------------------------------------------------------------
#  서버의 IP(예: AWS EC2 공인 IP, 자체 서버 IP)로 바로 접속:
#    http://<서버IP>:8000
#
#  전제: 그 IP:포트에 외부(또는 원하는 네트워크)에서 도달 가능해야 함.
#    - AWS EC2  : 보안 그룹 인바운드에 TCP 8000 허용
#    - 자체 서버: OS 방화벽 허용(ufw allow 8000), 가정집이면 공유기 포트포워딩
#
#  실행(레포 루트 기준):
#    cp deploy/direct-ip/.env.example deploy/direct-ip/.env   # 값 채우기
#    docker compose -f deploy/direct-ip/docker-compose.yml up -d --build
#
#  ⚠️ HTTPS가 아닌 평문 HTTP입니다 — 로그인 정보가 암호화되지 않으므로
#     수업·실습 등 통제된 용도로만 쓰고, 상시 공개 운영은 배포 A를 권장.
# ============================================================
services:
  dashboard:
    build: ../../server
    container_name: sensor-dash
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_PATH=/app/data/dashboard.db
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ../../data:/app/data
    ports:
      - "${PORT:-8000}:8000"               # 호스트포트:컨테이너포트
